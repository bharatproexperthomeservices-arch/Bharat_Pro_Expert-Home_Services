function LoginModal({ onClose }) {
  const [tab, setTab] = useState('customer');
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [name, setName] = useState('');
  const [phone, setPhone] = useState('');
  const [city, setCity] = useState('');
  const [category, setCategory] = useState('Cleaning');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  const googleSignIn = async () => {
    setError(''); setLoading(true);
    try {
      const result = await auth.signInWithPopup(googleProvider);
      const u = result.user;
      const collection = tab === 'customer' ? 'customers' : 'partners';
      const docRef = db.collection(collection).doc(u.uid);
      const snap = await docRef.get();
      if (!snap.exists) {
        await docRef.set({
          name: u.displayName || 'User', email: u.email, phone: u.phoneNumber || '',
          photo: u.photoURL || '', loginMethod: 'google',
          role: tab, status: tab === 'partner' ? 'pending' : 'active',
          createdAt: new Date()
        });
      }
      onClose();
    } catch (err) { setError(err.message); }
    finally { setLoading(false); }
  };

  const submit = async (e) => {
    e.preventDefault();
    setError(''); setLoading(true);
    try {
      if (mode === 'login') {
        await auth.signInWithEmailAndPassword(email, password);
      } else {
        const r = await auth.createUserWithEmailAndPassword(email, password);
        const collection = tab === 'customer' ? 'customers' : 'partners';
        await db.collection(collection).doc(r.user.uid).set({
          name, phone, email, city, category,
          loginMethod: 'email', role: tab,
          status: tab === 'partner' ? 'pending' : 'active',
          createdAt: new Date()
        });
      }
      onClose();
    } catch (err) { setError(err.message); }
    finally { setLoading(false); }
  };

  return (
    <div className="fixed inset-0 bg-black/60 z-[110] flex items-center justify-center p-4 overflow-y-auto">
      <div className="bg-white rounded-2xl w-full max-w-md my-8">
        <div className="flex border-b relative">
          <button onClick={() => { setTab('customer'); setError(''); }}
            className={`flex-1 py-4 font-bold text-sm ${tab === 'customer' ? 'navy border-b-2 navy-border' : 'text-gray-500'}`}>👤 Customer</button>
          <button onClick={() => { setTab('partner'); setError(''); }}
            className={`flex-1 py-4 font-bold text-sm ${tab === 'partner' ? 'navy border-b-2 navy-border' : 'text-gray-500'}`}>🧑‍🔧 Partner</button>
          <button onClick={onClose} className="px-4 text-2xl text-gray-400">✖</button>
        </div>
        <div className="p-6">
          <h2 className="text-lg font-bold navy mb-1">{tab === 'customer' ? 'Customer' : 'Partner'} {mode === 'login' ? 'Login' : 'Sign Up'}</h2>
          <p className="text-xs text-gray-500 mb-4">{tab === 'customer' ? 'Book home services easily' : 'Join as a service professional'}</p>
          <button onClick={googleSignIn} disabled={loading}
            className="w-full flex items-center justify-center gap-3 border-2 border-gray-200 hover:border-gray-300 rounded-lg py-3 mb-4 font-semibold text-gray-700 disabled:opacity-50">
            <svg className="w-5 h-5" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            {loading ? 'Please wait...' : 'Continue with Google'}
          </button>
          <div className="flex items-center gap-3 mb-4">
            <div className="flex-1 h-px bg-gray-200"></div>
            <span className="text-xs text-gray-400">OR</span>
            <div className="flex-1 h-px bg-gray-200"></div>
          </div>
          <form onSubmit={submit} className="space-y-3">
            {mode === 'signup' && (
              <>
                <input value={name} onChange={e => setName(e.target.value)} placeholder="Full Name" required className="w-full px-4 py-2.5 border rounded-lg text-sm outline-none focus:border-[#1a2b4a]" />
                <input value={phone} onChange={e => setPhone(e.target.value)} placeholder="Phone Number" required className="w-full px-4 py-2.5 border rounded-lg text-sm outline-none focus:border-[#1a2b4a]" />
                {tab === 'partner' && (
                  <>
                    <input value={city} onChange={e => setCity(e.target.value)} placeholder="City" required className="w-full px-4 py-2.5 border rounded-lg text-sm outline-none focus:border-[#1a2b4a]" />
                    <select value={category} onChange={e => setCategory(e.target.value)} className="w-full px-4 py-2.5 border rounded-lg text-sm outline-none focus:border-[#1a2b4a]">
                      <option>Cleaning</option><option>AC Repair</option><option>Plumbing</option>
                      <option>Electrical</option><option>Carpentry</option><option>Painting</option>
                      <option>Pest Control</option><option>Appliance Repair</option>
                    </select>
                  </>
                )}
              </>
            )}
            <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="Email" required className="w-full px-4 py-2.5 border rounded-lg text-sm outline-none focus:border-[#1a2b4a]" />
            <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="Password (min 6)" required className="w-full px-4 py-2.5 border rounded-lg text-sm outline-none focus:border-[#1a2b4a]" />
            {error && <div className="text-red-500 text-xs bg-red-50 p-2 rounded">{error}</div>}
            <button type="submit" disabled={loading} className="w-full navy-bg text-white py-2.5 rounded-lg font-semibold text-sm">
              {loading ? 'Please wait...' : (mode === 'login' ? `Login as ${tab}` : `Sign Up as ${tab}`)}
            </button>
          </form>
          <div className="text-center text-xs text-gray-600 pt-3">
            {mode === 'login' ? "New? " : "Have account? "}
            <button onClick={() => { setMode(mode === 'login' ? 'signup' : 'login'); setError(''); }} className="text-blue-600 font-semibold">
              {mode === 'login' ? 'Sign Up' : 'Login'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function BookingModal({ service, section, user, onClose, onLoginClick, onSuccess }) {
  const [form, setForm] = useState({ name: user?.displayName || '', phone: '', address: '', city: '', date: '', time: '', notes: '' });
  const [loading, setLoading] = useState(false);
  const amount = service.discountPrice > 0 ? service.discountPrice : service.price;
  const submit = async (e) => {
    e.preventDefault();
    if (!user) { onLoginClick(); return; }
    setLoading(true);
    try {
      await db.collection('bookings').add({
        customerId: user.uid, customerName: form.name, customerEmail: user.email,
        customerPhoto: user.photoURL || '', phone: form.phone,
        address: form.address, city: form.city,
        serviceName: service.name, categoryName: section.title,
        amount, date: form.date, time: form.time, notes: form.notes,
        status: 'new', createdAt: new Date()
      });
      onSuccess();
    } catch (err) { alert('Error: ' + err.message); }
    setLoading(false);
  };
  return (
    <div className="fixed inset-0 bg-black/60 z-[110] flex items-center justify-center p-4 overflow-y-auto">
      <div className="bg-white rounded-2xl w-full max-w-lg my-8">
        <div className="navy-bg px-6 py-4 text-white flex justify-between items-center rounded-t-2xl">
          <h2 className="font-bold">Confirm Booking</h2>
          <button onClick={onClose} className="text-xl">✖</button>
        </div>
        <div className="p-6">
          <div className="bg-gray-50 rounded-xl p-4 mb-5 flex items-center gap-3">
            <div className="w-16 h-16 rounded-lg bg-cover bg-center flex-shrink-0" style={{ backgroundImage: `url(${section.img})` }}></div>
            <div className="flex-1">
              <div className="font-semibold navy text-sm">{service.name}</div>
              <div className="text-xs text-gray-500">{section.title}</div>
            </div>
            <div className="text-right">
              <div className="text-xl font-bold navy">₹{amount.toLocaleString()}</div>
              <div className="text-xs font-medium" style={{color: '#16a34a'}}>Offer price</div>
            </div>
          </div>
          {user && (
            <div className="flex items-center gap-2 mb-4 p-2 bg-green-50 rounded-lg">
              {user.photoURL && <img src={user.photoURL} className="w-6 h-6 rounded-full" />}
              <span className="text-xs text-green-800 font-medium">Booking as: {user.email}</span>
            </div>
          )}
          <form onSubmit={submit} className="space-y-3">
            <input value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="Full Name *" required className="w-full px-4 py-2.5 border rounded-lg text-sm outline-none focus:border-[#1a2b4a]" />
            <input value={form.phone} onChange={e => setForm({ ...form, phone: e.target.value })} placeholder="Phone *" required className="w-full px-4 py-2.5 border rounded-lg text-sm outline-none focus:border-[#1a2b4a]" />
            <textarea value={form.address} onChange={e => setForm({ ...form, address: e.target.value })} placeholder="Full Address *" required rows="2" className="w-full px-4 py-2.5 border rounded-lg text-sm outline-none focus:border-[#1a2b4a]" />
            <div className="grid grid-cols-3 gap-2">
              <input value={form.city} onChange={e => setForm({ ...form, city: e.target.value })} placeholder="City *" required className="w-full px-3 py-2.5 border rounded-lg text-sm outline-none" />
              <input type="date" value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} required className="w-full px-3 py-2.5 border rounded-lg text-sm outline-none" />
              <input type="time" value={form.time} onChange={e => setForm({ ...form, time: e.target.value })} required className="w-full px-3 py-2.5 border rounded-lg text-sm outline-none" />
            </div>
            <textarea value={form.notes} onChange={e => setForm({ ...form, notes: e.target.value })} placeholder="Special instructions (optional)" rows="2" className="w-full px-4 py-2.5 border rounded-lg text-sm outline-none" />
            <button type="submit" disabled={loading} className="w-full navy-bg text-white py-3 rounded-lg font-bold disabled:opacity-50">
              {loading ? 'Booking...' : `Confirm Booking • ₹${amount.toLocaleString()}`}

          </form>
        </div>
      </div>
    </div>
  );
}

function PartnerDashboard({ user, onBack }) {
  const [profile, setProfile] = useState(null);
  const [jobs, setJobs] = useState([]);
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState({ name: '', phone: '', city: '', category: 'Cleaning', experience: '', aadhaar: '' });
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    const unsub = db.collection('partners').doc(user.uid).onSnapshot(s => {
      if (s.exists) {
        const data = s.data();
        setProfile({ id: s.id, ...data });
        setForm(f => ({ ...f, ...data }));
      } else {
        setEditing(true);
      }
    });
    const unsub2 = db.collection('bookings').where('partnerId', '==', user.uid).onSnapshot(s => {
      setJobs(s.docs.map(d => ({ id: d.id, ...d.data() })));
    });
    return () => { unsub(); unsub2(); };
  }, [user]);

  const saveProfile = async () => {
    setSaving(true);
    try {
      await db.collection('partners').doc(user.uid).set({
        ...form, email: user.email, photo: user.photoURL || '',
        role: 'partner', status: profile?.status || 'pending',
        updatedAt: new Date(), createdAt: profile?.createdAt || new Date()
      });
      setEditing(false);
    } catch (err) { alert(err.message); }
    setSaving(false);
  };

  const updateJobStatus = async (jobId, status) => {
    await db.collection('bookings').doc(jobId).update({ status, updatedAt: new Date() });
  };

  const earnings = jobs.filter(j => j.status === 'completed').reduce((s, j) => s + (j.amount || 0) * 0.8, 0);

  return (
    <div className="max-w-[1200px] mx-auto px-6 py-8">
      <button onClick={onBack} className="text-sm navy font-semibold mb-4">← Back to Home</button>
      <div className="bg-white rounded-2xl shadow border p-6 mb-6">
        <div className="flex items-center gap-4 flex-wrap">
          {user.photoURL ? (
            <img src={user.photoURL} className="w-20 h-20 rounded-full border-4 border-orange-200" />
          ) : (
            <div className="w-20 h-20 navy-bg text-white rounded-full flex items-center justify-center text-3xl font-bold">
              {(profile?.name || user.email)[0].toUpperCase()}
            </div>
          )}
          <div className="flex-1 min-w-[200px]">
            <h1 className="text-2xl font-bold navy">{profile?.name || user.displayName || 'Partner'}</h1>
            <p className="text-sm text-gray-500">{user.email}</p>
            <div className="flex gap-2 mt-2 flex-wrap">
              <span className={`px-3 py-1 rounded-full text-xs font-semibold ${
                profile?.status === 'active' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'
              }`}>
                {profile?.status === 'active' ? '✅ Verified Partner' : '⏳ Verification Pending'}
              </span>
              {profile?.category && <span className="px-3 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-700">{profile.category}</span>}
              {profile?.city && <span className="px-3 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-700">📍 {profile.city}</span>}
            </div>
          </div>
          <button onClick={() => setEditing(true)} className="navy-bg text-white px-4 py-2 rounded-lg text-sm font-semibold">
            ✏️ Edit Profile
          </button>
        </div>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div className="bg-white rounded-xl p-5 shadow border">
          <div className="text-gray-500 text-xs">Total Jobs</div>
          <div className="text-2xl font-bold navy mt-1">{jobs.length}</div>
        </div>
        <div className="bg-white rounded-xl p-5 shadow border">
          <div className="text-gray-500 text-xs">Completed</div>
          <div className="text-2xl font-bold text-green-600 mt-1">{jobs.filter(j => j.status === 'completed').length}</div>
        </div>
        <div className="bg-white rounded-xl p-5 shadow border">
          <div className="text-gray-500 text-xs">Ongoing</div>
          <div className="text-2xl font-bold text-yellow-600 mt-1">{jobs.filter(j => j.status === 'ongoing').length}</div>
        </div>
        <div className="bg-white rounded-xl p-5 shadow border">
          <div className="text-gray-500 text-xs">Earnings</div>
          <div className="text-2xl font-bold navy mt-1">₹{Math.round(earnings).toLocaleString()}</div>
        </div>
      </div>

      <div className="bg-white rounded-2xl shadow border p-6">
        <h2 className="font-bold navy text-lg mb-4">My Jobs</h2>
        {jobs.length === 0 ? (
          <div className="text-center py-12 text-gray-400">
            <div className="text-5xl mb-3">📋</div>
            <p>No jobs assigned yet</p>
            <p className="text-xs mt-2">Admin will assign jobs to you soon</p>
          </div>
        ) : (
          <div className="space-y-3">
            {jobs.map(j => (
              <div key={j.id} className="border rounded-xl p-4 flex justify-between items-start gap-4">
                <div>
                  <h3 className="font-bold navy">{j.serviceName}</h3>
                  <p className="text-xs text-gray-500">{j.categoryName}</p>
                  <p className="text-xs text-gray-600 mt-1">👤 {j.customerName} • 📞 {j.phone}</p>
                  <p className="text-xs text-gray-600">📍 {j.address}, {j.city}</p>
                  <div className="flex gap-3 mt-2 text-xs">
                    <span>📅 {j.date}</span><span>⏰ {j.time}</span>
                  </div>
                </div>
                <div className="text-right">
                  <div className="font-bold navy">₹{j.amount}</div>
                  <div className="text-xs text-green-600 mt-1">You earn: ₹{Math.round((j.amount || 0) * 0.8)}</div>
                  <select value={j.status || 'new'} onChange={e => updateJobStatus(j.id, e.target.value)}
                    className="text-xs border rounded px-2 py-1 mt-2">
                    <option value="new">New</option><option value="ongoing">Ongoing</option>
                    <option value="completed">Completed</option><option value="cancelled">Cancelled</option>
                  </select>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {editing && (
        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-white rounded-2xl w-full max-w-md p-6 my-8">
            <h2 className="font-bold text-lg navy mb-4">Complete Your Profile</h2>
            <div className="space-y-3">
              <input value={form.name || ''} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="Full Name *" className="w-full px-4 py-2.5 border rounded-lg text-sm outline-none" />
              <input value={form.phone || ''} onChange={e => setForm({ ...form, phone: e.target.value })} placeholder="Phone *" className="w-full px-4 py-2.5 border rounded-lg text-sm outline-none" />
              <input value={form.city || ''} onChange={e => setForm({ ...form, city: e.target.value })} placeholder="City *" className="w-full px-4 py-2.5 border rounded-lg text-sm outline-none" />
              <select value={form.category || 'Cleaning'} onChange={e => setForm({ ...form, category: e.target.value })} className="w-full px-4 py-2.5 border rounded-lg text-sm outline-none">
                <option>Cleaning</option><option>AC Repair</option><option>Plumbing</option>
                <option>Electrical</option><option>Carpentry</option><option>Painting</option>
                <option>Pest Control</option><option>Appliance Repair</option>
              </select>
              <input value={form.experience || ''} onChange={e => setForm({ ...form, experience: e.target.value })} placeholder="Years of Experience" className="w-full px-4 py-2.5 border rounded-lg text-sm outline-none" />
              <input value={form.aadhaar || ''} onChange={e => setForm({ ...form, aadhaar: e.target.value })} placeholder="Aadhaar Number (KYC)" className="w-full px-4 py-2.5 border rounded-lg text-sm outline-none" />
            </div>
            <div className="flex justify-end gap-2 mt-5">
              <button onClick={() => setEditing(false)} className="px-4 py-2 border rounded-lg text-sm">Cancel</button>
              <button onClick={saveProfile} disabled={saving} className="navy-bg text-white px-5 py-2 rounded-lg text-sm font-semibold disabled:opacity-50">
                {saving ? 'Saving...' : 'Save Profile'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [user, setUser] = useState(null);
  const [userRole, setUserRole] = useState(null);
  const [loading, setLoading] = useState(true);
  const [page, setPage] = useState('home');
  const [bookings, setBookings] = useState([]);
  const [showLogin, setShowLogin] = useState(false);
  const [bookingService, setBookingService] = useState(null);
  const [bookingSection, setBookingSection] = useState(null);
  const [location, setLocation] = useState('Gurugram, Haryana');
  const [toast, setToast] = useState('');

  useEffect(() => {
    return auth.onAuthStateChanged(async (u) => {
      setUser(u);
      if (u) {
        try {
          const custDoc = await db.collection('customers').doc(u.uid).get();
          const partDoc = await db.collection('partners').doc(u.uid).get();
          if (partDoc.exists) setUserRole('partner');
          else if (custDoc.exists) setUserRole('customer');
          else setUserRole('customer');
        } catch (e) { setUserRole('customer'); }
      } else {
        setUserRole(null);
      }
      setLoading(false);
    });
  }, []);

  useEffect(() => {
    if (!user) { setBookings([]); return; }
    const u = db.collection('bookings').where('customerId', '==', user.uid).onSnapshot(s =>
      setBookings(s.docs.map(d => ({ id: d.id, ...d.data() }))));
    return u;
  }, [user]);

  const scrollToServices = () => document.getElementById('cleaning-services')?.scrollIntoView({ behavior: 'smooth' });
  const handleCategoryClick = (sectionId) => document.getElementById('section-' + sectionId)?.scrollIntoView({ behavior: 'smooth' });
  const handleServiceClick = (service, section) => {
    if (!user) { setShowLogin(true); return; }
    setBookingService(service); setBookingSection(section);
  };

  if (loading) return (
    <div className="min-h-screen flex items-center justify-center">
      <div className="loading-spin"></div>
    </div>
  );

  return (
    <div className="min-h-screen bg-white">
      <Header user={user} userRole={userRole}
        onLogin={() => setShowLogin(true)}
        onLogout={() => { auth.signOut(); setPage('home'); }}
        onMyBookings={() => user ? setPage('mybookings') : setShowLogin(true)}
        onBook={scrollToServices}
        onPartnerDash={() => setPage('partner')}
        onAdminDash={() => window.open('test.html', '_blank')}
        onHome={() => setPage('home')} />

      {page === 'home' && (
        <>
          <Hero onBook={scrollToServices} location={location} setLocation={setLocation} />
          <div id="cleaning-services">
            <OurCleaningServices onCategoryClick={handleCategoryClick} />
          </div>
          {SECTIONS.map((section, i) => (
            <div key={i} id={'section-' + section.id}>
              <ServiceSection section={section} onServiceClick={handleServiceClick} />
            </div>
          ))}
          <Testimonials />
          <Footer />
        </>
      )}

      {page === 'mybookings' && user && <><MyBookings user={user} bookings={bookings} onHome={() => setPage('home')} /><Footer /></>}
      {page === 'partner' && user && <><PartnerDashboard user={user} onBack={() => setPage('home')} /><Footer /></>}

      {showLogin && <LoginModal onClose={() => setShowLogin(false)} />}

      {bookingService && bookingSection && (
        <BookingModal service={bookingService} section={bookingSection} user={user}
          onClose={() => { setBookingService(null); setBookingSection(null); }}
          onLoginClick={() => { setBookingService(null); setBookingSection(null); setShowLogin(true); }}
          onSuccess={() => {
            setBookingService(null); setBookingSection(null);
            setToast('Booking Confirmed! ✅');
            setTimeout(() => setToast(''), 3000);
          }} />
      )}

      {toast && (
        <div className="fixed bottom-6 right-6 navy-bg text-white px-6 py-3 rounded-lg shadow-xl z-[200] font-semibold text-sm">
          {toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
