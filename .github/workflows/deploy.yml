name: CI
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bpe_ci
        run: npx prisma validate --schema packages/db/prisma/schema.prisma
      - name: Generate Prisma client
        run: npx prisma generate --schema packages/db/prisma/schema.prisma
      - name: Typecheck database package
        run: npm run typecheck --workspace @bpe/db
      - name: Typecheck API
        run: npm run typecheck --workspace apps/api
      - name: Build Vite website (Vercel root app)
        run: npm run build
      - name: Build API
        run: npm run build --workspace apps/api
      - name: Build web
        run: npm run build --workspace apps/web
      - name: Validate Compose
        run: docker compose config -q
