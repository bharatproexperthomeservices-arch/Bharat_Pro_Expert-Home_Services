<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1B3D">
<title>Bharat Pro Expert</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
:root {
  --bg-cream: #FAF8F5;
  --navy: #0B1B3D;
  --navy-light: #132A5C;
  --gold: #C5A059;
  --gold-light: #E2C893;
  --gold-dark: #9A7730;
  --green: #22C55E;
  --green-dark: #16A34A;
  --grey-text: #64748B;
  --grey-light: #F1F5F9;
  --saffron: #FF9933;
  --white: #FFFFFF;
  --serif: "Playfair Display", Georgia, "Times New Roman", serif;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --u: clamp(12px, min(2.4vw, 2.4vh), 20px);
  --ease: cubic-bezier(.2, .8, .2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background-color: var(--bg-cream);
  color: var(--navy);
  font-family: var(--sans);
  -webkit-text-size-adjust: 100%;
}

body.onboarding-active {
  overflow: hidden;
}

/* Base living background gradient */
.bg-gradient {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at 50% 30%, #FFFFFF 0%, #FAF8F5 60%, #F3EFEA 100%);
  z-index: 0;
}

/* Onboarding Screen Container */
.onboarding-screen {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: calc(env(safe-area-inset-top, 0px) + 20px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(20px, env(safe-area-inset-left, 0px));
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.5s var(--ease), visibility 0.5s;
  background: radial-gradient(circle at 50% 30%, #FFFFFF 0%, #FAF8F5 60%, #F3EFEA 100%);
}

.onboarding-screen.on {
  opacity: 1;
  visibility: visible;
}

.onboarding-stack {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 440px;
  position: relative;
  z-index: 2;
}

/* Brand & Logo */
.ob-logo {
  position: relative;
  width: calc(var(--u) * 6.8);
  height: calc(var(--u) * 6.8);
  margin-bottom: calc(var(--u) * 1.2);
  border-radius: 50%;
  background: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 12px 32px rgba(11, 27, 61, 0.08), 0 2px 8px rgba(197, 160, 89, 0.15);
  padding: calc(var(--u) * 0.6);
}

.ob-logo::before {
  content: "";
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  padding: 3px;
  background: linear-gradient(135deg, var(--saffron), var(--gold), var(--green));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
}

.ob-logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.ob-title-navy {
  font-family: var(--serif);
  font-size: clamp(24px, 5vw, 32px);
  font-weight: 700;
  color: var(--navy);
  letter-spacing: -0.01em;
  line-height: 1.1;
  margin-bottom: 4px;
}

.ob-divider-rule {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 6px 0 10px;
  width: 100%;
  max-width: 260px;
}

.ob-divider-rule::before,
.ob-divider-rule::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

.ob-divider-rule span {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--gold);
}

.ob-tagline {
  font-size: clamp(13px, 2.5vw, 15px);
  color: var(--grey-text);
  font-weight: 400;
  margin-bottom: 32px;
}

/* Tricolor Progress Bar */
.tricolor-loader {
  width: 100%;
  max-width: 260px;
  margin-top: auto;
}

.tricolor-track {
  height: 4px;
  width: 100%;
  background: rgba(11, 27, 61, 0.08);
  border-radius: 99px;
  overflow: hidden;
  position: relative;
}

.tricolor-fill {
  position: absolute;
  inset: 0;
  width: 45%;
  background: linear-gradient(90deg, var(--saffron) 0%, #FFFFFF 50%, var(--green) 100%);
  border-radius: 99px;
  animation: tricolorSlide 1.8s ease-in-out infinite;
}

@keyframes tricolorSlide {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(250%); }
}

.tricolor-text {
  font-size: 11px;
  font-weight: 600;
  color: var(--navy);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-top: 10px;
}

/* Screen 2: Radar Pulse & Pin */
.radar-container {
  position: relative;
  width: calc(var(--u) * 8);
  height: calc(var(--u) * 8);
  margin-bottom: calc(var(--u) * 1.5);
  display: flex;
  align-items: center;
  justify-content: center;
}

.radar-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1.5px solid rgba(197, 160, 89, 0.4);
  animation: radarPulse 2.4s var(--ease) infinite;
}

.radar-ring:nth-child(2) { animation-delay: 0.8s; }
.radar-ring:nth-child(3) { animation-delay: 1.6s; }

@keyframes radarPulse {
  0% { transform: scale(0.3); opacity: 0; }
  50% { opacity: 1; }
  100% { transform: scale(1.4); opacity: 0; }
}

.gold-pin-circle {
  width: calc(var(--u) * 3.6);
  height: calc(var(--u) * 3.6);
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  box-shadow: 0 10px 24px rgba(197, 160, 89, 0.35), 0 0 0 6px rgba(197, 160, 89, 0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
  position: relative;
}

.gold-pin-circle svg {
  width: calc(var(--u) * 1.8);
  height: calc(var(--u) * 1.8);
  fill: var(--white);
}

.heading-serif-navy {
  font-family: var(--serif);
  font-size: clamp(20px, 4vw, 26px);
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 4px;
}

/* Screen 3: Success Location State */
.green-success-pin {
  width: calc(var(--u) * 3.8);
  height: calc(var(--u) * 3.8);
  border-radius: 50%;
  background: var(--green);
  border: 3px solid var(--gold);
  box-shadow: 0 12px 28px rgba(34, 197, 94, 0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
}

.green-success-pin svg {
  width: calc(var(--u) * 1.8);
  height: calc(var(--u) * 1.8);
  stroke: var(--white);
  stroke-width: 3;
}

.delivering-small-text {
  font-size: 13px;
  font-weight: 600;
  color: var(--navy);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 4px;
}

.home-gold-heading {
  font-family: var(--serif);
  font-size: clamp(28px, 6vw, 36px);
  font-weight: 700;
  color: var(--gold-dark);
  margin-bottom: 16px;
}

.address-white-card {
  background: var(--white);
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(11, 27, 61, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
  width: 100%;
  margin-bottom: 24px;
  border: 1px solid rgba(197, 160, 89, 0.25);
  text-align: center;
}

.address-text-grey {
  font-size: 14px;
  line-height: 1.5;
  color: var(--grey-text);
  font-weight: 500;
}

/* Buttons */
.btn-onboarding-primary {
  width: 100%;
  padding: 16px 24px;
  border-radius: 12px;
  background: var(--navy);
  color: var(--white);
  font-family: var(--sans);
  font-size: 16px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
  box-shadow: 0 8px 20px rgba(11, 27, 61, 0.2);
  min-height: 44px;
}

.btn-onboarding-primary:hover {
  background: var(--navy-light);
}

.btn-onboarding-primary:active {
  transform: scale(0.98);
}

.btn-change-location-link {
  background: transparent;
  border: none;
  color: var(--gold-dark);
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 14px;
  text-decoration: underline;
  transition: color 0.2s;
  min-height: 44px;
}

.btn-change-location-link:hover {
  color: var(--gold);
}

/* Complete Address Bottom Sheet Modal */
.address-modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 10000;
  background: rgba(11, 27, 61, 0.6);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}

.address-modal-overlay.open {
  opacity: 1;
  visibility: visible;
}

.address-modal-sheet {
  background: var(--white);
  border-top-left-radius: 24px;
  border-top-right-radius: 24px;
  padding: 24px 20px 32px 20px;
  width: 100%;
  max-width: 500px;
  box-shadow: 0 -10px 40px rgba(11, 27, 61, 0.25);
  border-top: 1px solid var(--gold-light);
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
  max-height: 90vh;
  overflow-y: auto;
}

.address-modal-overlay.open .address-modal-sheet {
  transform: translateY(0);
}

.sheet-drag-handle {
  width: 36px;
  height: 4px;
  background: rgba(11, 27, 61, 0.15);
  border-radius: 2px;
  margin: 0 auto 16px auto;
}

.address-modal-header {
  text-align: center;
  margin-bottom: 20px;
}

.address-modal-title {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 4px;
}

.address-modal-sub {
  font-size: 13px;
  color: var(--grey-text);
}

.address-form-group {
  margin-bottom: 16px;
  text-align: left;
}

.address-form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--navy);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}

.address-form-label .req-star {
  color: #EF4444;
}

.address-form-label .opt-tag {
  color: var(--grey-text);
  font-weight: 400;
  text-transform: none;
}

.address-input {
  width: 100%;
  padding: 13px 16px;
  border: 1.5px solid rgba(197, 160, 89, 0.4);
  border-radius: 12px;
  font-size: 14px;
  color: var(--navy);
  background: var(--white);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  font-family: var(--sans);
}

.address-input:focus {
  border-color: var(--gold-dark);
  box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.2);
}

.address-input-readonly {
  background: var(--grey-light);
  border-color: rgba(11, 27, 61, 0.1);
  color: var(--grey-text);
  cursor: not-allowed;
}

.address-field-error {
  color: #EF4444;
  font-size: 12px;
  margin-top: 4px;
  font-weight: 500;
}

/* Pincode Error Modal */
.pincode-modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 10000;
  background: rgba(11, 27, 61, 0.6);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s;
}

.pincode-modal-overlay.open {
  opacity: 1;
  visibility: visible;
}

.pincode-modal-card {
  background: var(--white);
  border-radius: 20px;
  padding: 28px 24px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
  text-align: center;
  border: 1px solid var(--gold-light);
}

.pincode-modal-title {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 8px;
}

.pincode-modal-sub {
  font-size: 13px;
  color: var(--grey-text);
  margin-bottom: 20px;
}

.pincode-input {
  width: 100%;
  padding: 14px 16px;
  border: 1.5px solid var(--gold-light);
  border-radius: 12px;
  font-size: 15px;
  color: var(--navy);
  outline: none;
  margin-bottom: 16px;
  transition: border-color 0.2s;
}

.pincode-input:focus {
  border-color: var(--gold-dark);
}

@media (prefers-reduced-motion: reduce) {
  .tricolor-fill, .radar-ring {
    animation: none !important;
  }
}
</style>
</head>
<body class="onboarding-active">

<div class="bg-gradient"></div>

<!-- Main SPA Web App Container -->
<div id="app"></div>
<div id="sheet-root"></div>
<div id="toast-root"></div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script type="module" src="js/supabase-config.js"></script>
<script type="module" src="js/data.js"></script>
<script type="module" src="js/location-flow.js"></script>
<script type="module" src="js/app.js"></script>
<script type="module" src="js/overrides.js"></script>
</body>
</html>
